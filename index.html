<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="POSTORO — Premium wall posters for your space.">
<title>POSTORO — Premium Wall Posters</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

:root{
  --bg:#080808;
  --card:#11110f;
  --gold:#d4af67;
  --gold2:#f0d99a;
  --white:#f7f5ef;
  --muted:#9b9b96;
  --line:rgba(255,255,255,.10);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--white);
  font-family:"DM Sans",sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* NAVBAR */

.nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:100;
  background:rgba(8,8,8,.82);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.nav-inner{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:700;
  letter-spacing:4px;
}

.logo span{
  color:var(--gold);
}

.nav-links{
  display:flex;
  gap:28px;
  color:#bbb;
  font-size:14px;
}

.nav-links a:hover{
  color:white;
}

.nav-btn{
  border:1px solid var(--gold);
  color:var(--gold);
  padding:10px 17px;
  border-radius:30px;
  font-size:13px;
}

/* HERO */

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  padding-top:76px;
}

.hero:before{
  content:"";
  position:absolute;
  width:650px;
  height:650px;
  right:-250px;
  top:80px;
  background:radial-gradient(circle,rgba(212,175,103,.16),transparent 65%);
}

.hero-content{
  position:relative;
  max-width:760px;
  padding:90px 0;
}

.eyebrow{
  color:var(--gold);
  letter-spacing:4px;
  text-transform:uppercase;
  font-size:12px;
  margin-bottom:22px;
}

.hero h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(52px,8vw,94px);
  line-height:.98;
  letter-spacing:-3px;
}

.hero h1 span{
  color:var(--gold);
}

.hero p{
  max-width:570px;
  color:var(--muted);
  font-size:18px;
  line-height:1.7;
  margin-top:28px;
}

.hero-buttons{
  display:flex;
  gap:14px;
  margin-top:35px;
  flex-wrap:wrap;
}
