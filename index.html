<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postoro — Premium Wall Posters</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#080808;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(8,8,8,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #222;
  padding:18px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:27px;
  font-weight:800;
  letter-spacing:2px;
}

nav a{
  color:#aaa;
  text-decoration:none;
  margin-left:20px;
  font-size:14px;
}

nav a:hover{
  color:#fff;
}

.hero{
  min-height:78vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:70px 20px;
  background:
    radial-gradient(circle at center,#242424 0,#080808 55%);
}

.hero h1{
  font-size:clamp(45px,10vw,90px);
  letter-spacing:-3px;
  margin-bottom:15px;
}

.hero h1 span{
  background:linear-gradient(90deg,#fff,#888);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#aaa;
  font-size:18px;
  max-width:600px;
  margin:auto;
  line-height:1.6;
}

.btn{
  display:inline-block;
  margin-top:30px;
  padding:15px 28px;
  border-radius:30px;
  background:#fff;
  color:#000;
  text-decoration:none;
  font-weight:bold;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-3px);
}

section{
  padding:70px 7%;
}

.title{
  text-align:center;
  font-size:35px;
  margin-bottom:45px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

.card{
  background:#111;
  border:1px solid #242424;
  border-radius:18px;
  overflow:hidden;
  transition:.3s;
}

.card:hover{
  transform:translateY(-7px);
  border-color:#555;
}

.poster{
  height:270px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#252525,#0e0e0e);
  font-size:28px;
  font-weight:bold;
  letter-spacing:2px;
}

.card-content{
  padding:20px;
}

.card h3{
  margin-bottom:8px;
}

.price{
  color:#aaa;
  margin-bottom:15px;
}

.order{
  display:block;
  text-align:center;
  padding:12px;
  background:#fff;
  color:#000;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
}

.about{
  text-align:center;
  max-width:750px;
  margin:auto;
  color:#aaa;
  line-height:1.8;
}
